<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .color-change {
            color: white;
        }

        .change-size {
            width: 600px;

        }

        .left-space {
            margin-left: 200px;
        }

        .spacing {
            margin-left: 100px;
            background-color: rgba(41, 73, 41, 0.1);
        }

        .main {
            height: 1000px;
            border: 2px solid blue;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        .img-size {
            width: 400px;
            height: 400px;
        }
    </style>
</head>

<body>
    <!-- Navbar starts -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse " id="navbarSupportedContent">
                <form class="d-flex left-space" role="search">
                    <input class="form-control me-2 change-size" type="search" placeholder="Search"
                        aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 spacing">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">SHOES</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link color-change" href="#">MEN</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle color-change" href="#" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Dropdown
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">WOMEN</a>
                    </li>
                </ul>

            </div>
        </div>
    </nav>

    <!-- NavBar ends -->

    <!-- Carousel starts -->

    <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://img.olympics.com/images/image/private/t_s_16_9_g_auto/t_s_w1460/f_auto/primary/gya8gh1uaqdsryyumdpk"
                    class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="https://img.olympics.com/images/image/private/ar_16:9,c_fill/f_auto/v1757345858/primary/qgmkhw73b1xqb7r98vjw"
                    class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
                <img src="https://static.india.com/wp-content/uploads/2023/11/Collage-Maker-05-Nov-2023-10-00-AM-1837.jpg?impolicy=Medium_Widthonly&w=700"
                    class="d-block w-100" alt="...">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- Carousel ends -->

    <br>
    <br>
    <!-- Flexbox start  -->
    <div class="main">
        <div class="one">
            <img class="img-size" src="https://blog.playo.co/wp-content/uploads/2016/03/Virat-Kohli.jpeg"
                alt="Virat-Kohli">
            <h1><u>CRICKET</u></h1>
        </div>

        <div class="two">
            <img class="img-size" src="https://blog.playo.co/wp-content/uploads/2016/03/Virat-Kohli.jpeg"
                alt="Virat-Kohli">
            <h1><u>CRICKET</u></h1>
        </div>

        <div class="three">
            <img class="img-size" src="https://blog.playo.co/wp-content/uploads/2016/03/Virat-Kohli.jpeg"
                alt="Virat-Kohli">
            <h1><u>CRICKET</u></h1>
        </div>

    </div>

    <!-- Flexbox end -->

    <!-- Script Code -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
