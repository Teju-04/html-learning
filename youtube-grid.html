<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Grid</title>
    <style>
        .main {
            display: grid;
            grid-template-columns: 70% 30%;
        }
        
        .one {
            width: auto;
            height: 700px;
        }
        #main-frame {
            width: 800px;
            height: 700px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="one">
            <iframe id="main-frame" src="iphone.mp4"></iframe>
            <h2>Iphone 17 launch | Apple launch | Demonstrated by</h2>
        </div>
        <div class="two">
            <iframe src="iphone.mp4"></iframe>
            <h4>Lorem ipsum view</h4>
        
        
            <iframe src="iphone.mp4"></iframe>
            <h4>Lorem ipsum view</h4>
        
        
            <iframe src="iphone.mp4"></iframe>
            <h4>Lorem ipsum view</h4>
        </div>
    </div>
</body>
</html>
