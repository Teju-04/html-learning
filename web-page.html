<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Web Page</title>
    <style>
      .section {
        position: relative;
      }
      .sub-section {
        position: absolute;
        top: 200px;
        left: 550px;

        h1,
        p {
          color: white;
          text-align: center;
        }

        #learn-more {
          background-color: transparent;
          color: white;
          border: 2px solid white;
          border-radius: 50px;
          width: 150px;
          height: 50px;
        }
        #get-started {
          background-color: lightseagreen;
          color: white;
          border: 2px solid lightseagreen;
          border-radius: 50px;
          width: 150px;
          height: 50px;
        }
      }
    </style>
  </head>
  <body>
    <div class="section">
      <img
        src="https://pictures.altai-travel.com/1920x0/mount-everest-aerial-view-himalayas-istock-3745.jpg"
      />
      <div class="sub-section">
        <h1>With Great Design</h1>
        <h1>Comes Great Response</h1>
        <p>Make a beautiful hubspot website -just the way you want it.</p>
        <div class="buttons"></div>
        <button id="learn-more">LEARN MORE</button>

        <button id="get-started">GET STARTED</button>
      </div>
    </div>
  </body>
</html>
