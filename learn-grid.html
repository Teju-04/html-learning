<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .one {
            width: auto;
            height: 300px;
            background-color: aquamarine;
            text-align: center;
            font-size: 200px;
        }
        .two {
            width: auto;
            height: 300px;
            background-color: lightskyblue;
            text-align: center;
            font-size: 200px;
        }
        .three {
            width: auto;
            height: 300px;
            background-color: rgb(166, 216, 26);
            text-align: center;
            font-size: 200px;
        }
        .four {
            width: auto;
            height: 300px;
            background-color: blanchedalmond;
            text-align: center;
            font-size: 200px;
        }

        .main {
            display: grid;
            /* grid-template-columns: auto auto auto ; */
            /* 3 sections so 3 autos */
            /* divided into 3 sections */

             /* grid-template-columns: auto auto; */
             /* grid-template-columns: 200px 800px 400px;  */
             grid-template-columns: 30% 70%;
             

        }
    </style>
</head>
<body>
    <div class="main">
        <div class="one">1</div>
        <div class="two">2</div>
        <div class="three">3</div>
        <div class="four">4</div>
    </div>
</body>
</html>
